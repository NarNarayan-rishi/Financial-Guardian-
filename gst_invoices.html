<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Guardian | GST Invoices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .page-header h1 { font-size: 1.8rem; background: linear-gradient(135deg, #fff, #9ba3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .summary-card { padding: 1.5rem; border-radius: 16px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.02); text-align: center; }
        .summary-card h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 400; }
        .summary-card .value { font-size: 2rem; font-weight: 800; }
        .val-blue { color: var(--neon-blue); }
        .val-green { color: var(--neon-green); }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--panel-border); font-size: 0.9rem; }
        th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <div>
                <h1>GST Invoice History <span id="gstHelpIcon" onclick="startGstTour()" class="help-icon" style="margin-left: 0.5rem;" title="Start Interactive Tour">i</span></h1>
                <p style="color: #9ba3af;">View all your generated tax invoices</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="setting-group font-controls" style="display: flex; align-items: center; gap: 0.2rem;">
                    <button id="decreaseFont" class="btn-icon" aria-label="Decrease Font Size" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;">A-</button>
                    <button id="increaseFont" class="btn-icon" aria-label="Increase Font Size" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;">A+</button>
                </div>
                <button onclick="window.close(); window.location.href='index.html';" class="btn-icon" style="text-decoration: none; padding: 0.5rem 1rem;">← Back to Dashboard</button>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card glass-panel">
                <h3>Total Invoices Generated</h3>
                <div class="value val-blue" id="totalInvoicesCount">0</div>
            </div>
            <div class="summary-card glass-panel">
                <h3>Total Billed Amount</h3>
                <div class="value val-green" id="totalBilledDisplay">₹0.00</div>
            </div>
            <div class="summary-card glass-panel">
                <h3>Total GST Collected</h3>
                <div class="value" style="color: #f59e0b;" id="totalGstDisplay">₹0.00</div>
            </div>
        </div>

        <div class="history-actions" style="margin-bottom: 1rem; display: none; gap: 1rem;" id="bulkActions">
            <button class="btn-primary" onclick="bulkDownloadPdfs()" style="background: var(--neon-blue);">Bulk Download / Print</button>
            <button class="btn-danger" onclick="bulkDeleteInvoices()">Clear Selected</button>
        </div>

        <div class="glass-panel" style="overflow-x: auto;">
            <table id="gstTable">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="selectAllGst" onchange="toggleAllGst(this)"></th>
                        <th>Date</th>
                        <th>Invoice No</th>
                        <th>Buyer Name</th>
                        <th>Total Bill</th>
                        <th>Total GST</th>
                        <th style="text-align: center;">Download/View</th>
                        <th style="text-align: center;">Delete</th>
                    </tr>
                </thead>
                <tbody id="gstTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                No GST invoices generated yet.
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="shared.js"></script>
    <script>
        window.startGstTour = function() {
            startTour([
                { target: '.summary-grid', title: 'Dedicated GST Invoice History', desc: 'A complete overview of every tax invoice you have generated, automatically tracking Total Billed and Total Tax Collected.' },
                { target: '#gstTable', title: 'Invoice Database', desc: 'Quickly find any past invoice and instantly pull up the PDF.' }
            ]);
        };
        applySharedFontSize();


        const history = JSON.parse(localStorage.getItem('fg_gst_history')) || [];
        const tableBody = document.getElementById('gstTableBody');
        const emptyState = document.getElementById('emptyState');
        const gstTable = document.getElementById('gstTable');
        
        let totalCount = 0;
        let totalBilled = 0;
        let totalGst = 0;

        function formatMoneyView(amount) {
            return getCurrencySymbol(currentCurrencyCode) + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        if (history.length === 0) {
            gstTable.style.display = 'none';
            emptyState.style.display = 'block';
        } else {
            // Sort newest first
            history.sort((a, b) => new Date(b.date) - new Date(a.date));

            history.forEach(inv => {
                totalCount++;
                totalBilled += inv.grandTotal;
                totalGst += inv.totalTax;

                const tr = document.createElement('tr');
                const dateObj = new Date(inv.date);
                const dateStr = dateObj.toLocaleDateString('en-IN', { year:'numeric', month:'short', day:'numeric' });
                
                tr.innerHTML = `
                    <td><input type="checkbox" class="gst-row-checkbox" value="${inv.invoiceNo}" onchange="toggleGstBulkActions()"></td>
                    <td>${dateStr}</td>
                    <td><strong>${inv.invoiceNo}</strong></td>
                    <td>${inv.buyerName}</td>
                    <td style="color: var(--neon-green);">${formatMoneyView(inv.grandTotal)}</td>
                    <td style="color: #f59e0b;">${formatMoneyView(inv.totalTax)}</td>
                    <td style="text-align: center;">
                        <button class="btn-icon" style="padding: 0.4rem; background: transparent; color: var(--neon-blue); box-shadow: none; display: inline-flex; align-items: center; justify-content: center;" onclick="viewPdf('${inv.invoiceNo}')" title="Download PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-icon" style="padding: 0.4rem; background: transparent; color: var(--neon-red); box-shadow: none; display: inline-flex; align-items: center; justify-content: center;" onclick="deleteInvoice('${inv.invoiceNo}')" title="Delete Invoice">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        document.getElementById('totalInvoicesCount').textContent = totalCount;
        document.getElementById('totalBilledDisplay').textContent = formatMoneyView(totalBilled);
        document.getElementById('totalGstDisplay').textContent = formatMoneyView(totalGst);

        function toggleAllGst(source) {
            const checkboxes = document.querySelectorAll('.gst-row-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
            toggleGstBulkActions();
        }

        function toggleGstBulkActions() {
            const anyChecked = document.querySelectorAll('.gst-row-checkbox:checked').length > 0;
            document.getElementById('bulkActions').style.display = anyChecked ? 'flex' : 'none';
        }

        function deleteInvoice(invoiceNo) {
            if (confirm("Are you sure you want to clear this invoice?")) {
                const newHistory = history.filter(h => h.invoiceNo !== invoiceNo);
                localStorage.setItem('fg_gst_history', JSON.stringify(newHistory));
                window.location.reload();
            }
        }

        function bulkDeleteInvoices() {
            if (confirm("Are you sure you want to clear ALL selected invoices?")) {
                const checked = Array.from(document.querySelectorAll('.gst-row-checkbox:checked')).map(cb => cb.value);
                const newHistory = history.filter(h => !checked.includes(h.invoiceNo));
                localStorage.setItem('fg_gst_history', JSON.stringify(newHistory));
                window.location.reload();
            }
        }

        function bulkDownloadPdfs() {
            const checked = Array.from(document.querySelectorAll('.gst-row-checkbox:checked')).map(cb => cb.value);
            const selectedInvoices = history.filter(h => checked.includes(h.invoiceNo) && h.htmlContent);
            
            if (selectedInvoices.length === 0) {
                alert("No compatible invoices selected (older invoices without HTML blueprints cannot be bulk downloaded).");
                return;
            }

            let combinedHtml = '';
            selectedInvoices.forEach((inv, index) => {
                combinedHtml += `<div class="invoice-container">${inv.htmlContent}</div>`;
                if (index < selectedInvoices.length - 1) {
                    combinedHtml += `<div style="page-break-after: always;"></div>`; // Page break between invoices
                }
            });

            const printWin = window.open('', '_blank');
            printWin.document.write(`<html><head><title>Bulk GST Invoices</title>
            <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
            <style>
                body{font-family:'Outfit',sans-serif;padding:1.5rem;color:#111;background:#f8fafc;}
                h2{border-bottom:2px solid #111;padding-bottom:0.5rem;}
                table{width:100%;border-collapse:collapse;margin:1rem 0;}
                th,td{border:1px solid #ccc;padding:0.5rem;text-align:left;font-size:0.85rem;}
                th{background:#f3f4f6;}
                .invoice-container { background:#fff; padding:2rem; max-width:800px; margin: 2rem auto; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 8px; }
                @media print{ body{background:#fff;} .invoice-container{box-shadow:none;margin:0;padding:0;} @page{margin:0.5in;} .no-print{display:none;} }
            </style></head><body>
            <div class="no-print" style="text-align:center;margin-bottom:1rem;">
                <button onclick="window.print()" style="background:#3b82f6;color:#fff;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;font-weight:bold;">Print / Save All as PDF</button>
            </div>
            ${combinedHtml}
            </body></html>`);
            printWin.document.close();
        }

        async function viewPdf(invoiceNo) {
            const historyItem = history.find(h => h.invoiceNo === invoiceNo);
            
            if (historyItem && historyItem.htmlContent) {
                const printWin = window.open('', '_blank');
                printWin.document.write(`<html><head><title>GST Invoice ${invoiceNo}</title>
                <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
                <style>
                    body{font-family:'Outfit',sans-serif;padding:1.5rem;color:#111;background:#f8fafc;}
                    h2{border-bottom:2px solid #111;padding-bottom:0.5rem;}
                    table{width:100%;border-collapse:collapse;margin:1rem 0;}
                    th,td{border:1px solid #ccc;padding:0.5rem;text-align:left;font-size:0.85rem;}
                    th{background:#f3f4f6;}
                    .invoice-container { background:#fff; padding:2rem; max-width:800px; margin: 2rem auto; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 8px; }
                    @media print{ body{background:#fff;} .invoice-container{box-shadow:none;margin:0;padding:0;} @page{margin:0.5in;} .no-print{display:none;} }
                </style></head><body>
                <div class="no-print" style="text-align:center;margin-bottom:1rem;">
                    <button onclick="window.print()" style="background:#3b82f6;color:#fff;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;font-weight:bold;">Print / Save as PDF</button>
                </div>
                <div class="invoice-container">${historyItem.htmlContent}</div>
                </body></html>`);
                printWin.document.close();
                return;
            }

            // Fallback for older invoices created before the HTML blueprint update
            if (saveMode === 'custom') {
                try {
                    let dirHandle = null;
                    if (window.getDirectoryHandle) dirHandle = await window.getDirectoryHandle();
                    
                    if (!dirHandle) {
                        alert("This older invoice was saved to a custom folder, but the folder connection was lost. Please find the PDF manually on your computer.");
                        return;
                    }
                    
                    const permission = await dirHandle.queryPermission({ mode: 'read' });
                    if (permission !== 'granted') {
                        const requestPerm = await dirHandle.requestPermission({ mode: 'read' });
                        if (requestPerm !== 'granted') {
                            alert("Permission to read the folder was denied.");
                            return;
                        }
                    }

                    const pdfFilename = `${invoiceNo}.pdf`;
                    const fileHandle = await dirHandle.getFileHandle(pdfFilename);
                    const file = await fileHandle.getFile();
                    const blobUrl = URL.createObjectURL(file);
                    window.open(blobUrl, '_blank');
                    
                } catch (e) {
                    console.error(e);
                    alert("Could not find or open the PDF. It might have been moved or deleted from the folder.");
                }
            } else {
                alert("This older invoice was saved to your Downloads folder or printed. Please open it manually from your computer.");
            }
        }
    </script>
</body>
</html>
