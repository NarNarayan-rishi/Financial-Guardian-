<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Guardian | Full Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .ledger-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            text-align: left;
        }
        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--panel-border);
        }
        th {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .status-badge {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: var(--neon-green); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: var(--neon-red); }
        .bg-blue { background: rgba(59, 130, 246, 0.2); color: var(--neon-blue); }
        .bg-yellow { background: rgba(234, 179, 8, 0.15); color: var(--neon-yellow); }
        .bg-gray { background: rgba(155, 163, 175, 0.15); color: var(--text-muted); }
        
        .header-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .date-separator td {
            background: rgba(59, 130, 246, 0.08);
            font-weight: 700;
            color: var(--neon-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.6rem 1rem;
        }
        
        tr.pending-row {
            background: rgba(234, 179, 8, 0.05);
        }
        
        .invoice-link {
            color: var(--neon-blue);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        .btn-delete {
            background: transparent;
            color: var(--neon-red);
            border: none;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <!-- View Invoice Modal -->
    <div id="viewInvoiceModal" class="overlay" style="display: none;">
        <div class="modal glass-panel" style="position: relative; max-width: 400px;">
            <button class="modal-close" onclick="this.closest('.overlay').style.display='none'">×</button>
            <h2 data-i18n="btn_print">Invoice Details</h2>
            <div id="viewInvoiceContent" style="margin-top: 1rem;"></div>
            <div class="modal-actions" style="margin-top:1.5rem;">
                <button class="btn-primary" onclick="printSimpleInvoice()" data-i18n="btn_print">Print</button>
                <button class="btn-danger" onclick="document.getElementById('viewInvoiceModal').style.display='none'" data-i18n="btn_close">Close</button>
            </div>
            </div>
        </div>
    </div>

    <div class="ledger-container" id="printableLedger">
        <header class="main-header" style="flex-direction: column; align-items: flex-start; margin-bottom: 2rem;">
            <div class="logo">
                <h1><span data-i18n="ledger_title">Full Transaction Ledger</span> <span id="ledgerHelpIcon" onclick="startLedgerTour()" class="help-icon" style="margin-left: 0.5rem;" title="Start Interactive Tour">i</span></h1>
                <p class="subtitle" data-i18n="ledger_subtitle">Complete Financial History</p>
            </div>
            
            <div class="header-actions no-print" style="width: 100%;">
                <button onclick="window.close(); window.location.href='index.html';" class="btn-icon" style="text-decoration: none;" data-i18n="btn_back_dash">Back to Dashboard</button>
                <a href="gst_invoices.html" class="btn-icon" id="gstInvoicesBtn" style="text-decoration: none;" data-i18n="btn_gst_invoices">GST Invoices</a>
                <button id="exportCsvBtn" class="btn-icon" data-i18n="btn_export_csv">Export (CSV)</button>
                <button id="exportPdfBtn" class="btn-icon" data-i18n="btn_export_pdf">Export (PDF)</button>
                
                <div class="setting-group font-controls" style="margin-left: 0.5rem; display: flex; align-items: center; gap: 0.2rem;">
                    <button id="decreaseFont" class="btn-icon" aria-label="Decrease Font Size" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;">A-</button>
                    <button id="increaseFont" class="btn-icon" aria-label="Increase Font Size" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;">A+</button>
                </div>
                
                <button id="clearDataBtn" class="btn-danger" style="width: auto; margin-top: 0; padding:0.3rem 0.6rem; font-size:0.75rem; margin-left: auto;" onclick="toggleSelectionMode()">Clear Data</button>
                
                <div id="clearDataActions" style="display:none; align-items:center; gap: 0.5rem; background: rgba(239, 68, 68, 0.1); padding: 0.2rem 0.5rem; border-radius: 8px; border: 1px solid var(--neon-red); margin-left: auto;">
                    <span id="selectedCountDisplay" style="color:var(--neon-red);font-weight:bold;font-size:0.85rem;">0 Selected</span>
                    <button class="btn-danger" style="width: auto; margin-top: 0; padding:0.4rem 0.8rem; font-size:0.8rem;" onclick="bulkDeleteUI()">Proceed to Delete</button>
                    <button class="btn-icon" style="padding:0.4rem; font-size:0.8rem; color: var(--text-muted);" onclick="toggleSelectionMode()">Cancel</button>
                </div>
            </div>
        </header>
        
        <div class="glass-panel" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th class="selection-col" style="display:none; width: 40px;"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"></th>
                        <th data-i18n="col_date">Date & Time</th>
                        <th data-i18n="col_desc">Description</th>
                        <th data-i18n="col_qty">Qty</th>
                        <th data-i18n="col_type">Type</th>
                        <th data-i18n="col_status">Status</th>
                        <th>Invoice / GST</th>
                        <th data-i18n="col_amount">Amount</th>
                        <th class="no-print" data-i18n="col_action">Action</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <footer class="app-footer">
        <div>&copy; 2026 Dhruv Gupta-Financial Guardian. All rights reserved</div>
        <div style="margin-top: 0.5rem; font-size: 0.8rem;">
            <a href="legal.html" style="color: var(--text-muted); text-decoration: none; margin: 0 0.5rem;">Terms & Privacy</a> |
            <a href="legal.html" style="color: var(--text-muted); text-decoration: none; margin: 0 0.5rem;">Licenses</a>
        </div>
    </footer>

    <!-- Partial Payment Modal -->
    <div id="partialPayModal" class="overlay" style="display: none;">
        <div class="modal glass-panel" style="position: relative; max-width: 450px;">
            <button class="modal-close" onclick="document.getElementById('partialPayModal').style.display='none'">×</button>
            <h2 id="partialPayTitle">Record Partial Payment</h2>
            <p id="partialPayInfo" style="color: var(--text-muted); margin-bottom: 1rem;"></p>
            <div class="form-group">
                <label id="partialPayLabel">Amount Received</label>
                <input type="number" id="partialPayAmount" min="0.01" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group" id="partialNextDateGroup" style="display:none;">
                <label>Next Expected Date for Remaining</label>
                <input type="date" id="partialNextDate">
            </div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="submitPartialPayment()">Submit</button>
                <button class="btn-danger" onclick="document.getElementById('partialPayModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="shared.js"></script>
    <script>
        window.startLedgerTour = function() {
            startTour([
                { target: '.header-actions', title: 'Export & Clear Data', desc: 'Use these tools to securely export your ledger as CSV/PDF, or use Advanced Clear Data to bulk-delete transactions by specific dates.' },
                { target: 'table', title: 'Full Ledger & Partial Payments', desc: 'View all transactions here. For Pending/Future Payments, you can use the Partial Payment button to slowly pay them off over time until settled.' },
                { target: 'table', title: 'Necessary vs Unnecessary Expenses', desc: 'Track your spending habits! You can mark each expense in the ledger as Necessary or Unnecessary to help the AI Accountant give you better advice.' },
                { target: 'table', title: 'Grouped GST Invoices', desc: 'GST invoices appear as a single grouped row for cleaner reading. Click "View Invoice" to instantly pull up the original saved HTML invoice.' }
            ]);
        };
        
        applySharedFontSize();
    </script>
    <script src="Transactions1.js"></script>
</body>
</html>
