<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Guardian | Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            text-align: center;
        }
        .contact-header {
            margin-bottom: 2rem;
        }
        .contact-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #fff, #9ba3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dev-info {
            font-size: 1.2rem;
            margin: 1.5rem 0;
            line-height: 1.8;
        }
        .dev-info strong {
            color: var(--neon-blue);
        }
        .email-link {
            color: var(--neon-green);
            text-decoration: none;
            font-weight: 600;
        }
        .email-link:hover {
            text-decoration: underline;
        }
        .app-footer {
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--panel-border);
        }
    </style>
</head>
<body>
    <div class="contact-container glass-panel">
        <div class="contact-header">
            <h1>Contact Us</h1>
            <p style="color: var(--text-muted);">Get in touch with the developer.</p>
        </div>
        
        <div class="dev-info">
            <p><strong>Developer:</strong> Dhruv Gupta</p>
            <p><strong>Email ID:</strong> <a href="mailto:dhruv720gupta@gmail.com" class="email-link">dhruv720gupta@gmail.com</a></p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn-primary" style="text-decoration: none; padding: 0.6rem 1.2rem; display: inline-block;">← Back to Dashboard</a>
        </div>
    </div>
    
    <footer class="app-footer">
        &copy; 2026 Dhruv Gupta-Financial Guardian. All rights reserved
    </footer>

    <script src="shared.js"></script>
    <script>applySharedFontSize();</script>
</body>
</html>
